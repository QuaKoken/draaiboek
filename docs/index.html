<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Draaiboek · QuaKoken</title>
<meta name="theme-color" content="#4F4A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draaiboek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: olijfgroene kopband in QuaKoken-stijl, daarna één leeskolom met dagbladen per fase, tijdlijnrijen als draaiboekregels, actielijst onderaan */
:root{
  --olive:#6B6431; --olive-deep:#4F4A22; --olive-soft:#E9E7D6; --plum:#3C2452;
  --bg:#FBFAF5; --surface:#FFFFFF; --ink:#24221A; --muted:#6C6956; --line:#DDDACB;
  --band-ink:#FBFAF5; --chip:#F1EFE3; --ok:#3F6B3A; --ok-bg:#E4EEDC; --warn:#8A5A12; --warn-bg:#F6EBD4; --open-bg:#EEE9F2;
  --f-script:"Pinyon Script","Snell Roundhand",cursive;
  --f-serif:"Cormorant Garamond",Georgia,serif;
  --f-sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --olive:#8F8746; --olive-deep:#2B2914; --olive-soft:#33311E; --plum:#C9B2DE;
  --bg:#171610; --surface:#201F17; --ink:#ECEADF; --muted:#A8A590; --line:#38362A;
  --band-ink:#F4F2E6; --chip:#2A2920; --ok:#9CC490; --ok-bg:#25311F; --warn:#E2B66A; --warn-bg:#3A2E18; --open-bg:#2D2535; color-scheme:dark}}
:root[data-theme="dark"]{
  --olive:#8F8746; --olive-deep:#2B2914; --olive-soft:#33311E; --plum:#C9B2DE;
  --bg:#171610; --surface:#201F17; --ink:#ECEADF; --muted:#A8A590; --line:#38362A;
  --band-ink:#F4F2E6; --chip:#2A2920; --ok:#9CC490; --ok-bg:#25311F; --warn:#E2B66A; --warn-bg:#3A2E18; --open-bg:#2D2535; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--plum)}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

.hero{background:var(--olive-deep);color:var(--band-ink)}
.hero .wrap{padding-block:56px 40px;display:grid;gap:18px}
.hero .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.hero h1{font-family:var(--f-script);font-weight:400;font-size:clamp(56px,11vw,104px);line-height:1;margin:0;text-wrap:balance}
.hero .names{font-family:var(--f-serif);font-size:clamp(26px,4.5vw,38px);margin:0}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;opacity:.92}
.hero .meta span{display:inline-flex;gap:8px;align-items:center}
.stamp{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.toc .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.toc a{flex:none;text-decoration:none;color:var(--ink);font-size:14px;padding:6px 12px;border-radius:999px;background:var(--chip)}
nav.toc a:hover{background:var(--olive-soft)}

section{padding-block:44px 8px}
.sec-head{display:grid;gap:4px;margin-bottom:22px}
.sec-head .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive)}
h2{font-family:var(--f-serif);font-weight:500;font-size:clamp(30px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-sans);font-weight:600;font-size:17px;margin:0}
p.lead{color:var(--muted);max-width:65ch;margin:0}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact{background:var(--surface);padding:16px 18px;display:grid;gap:2px;min-width:0}
.fact .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-size:17px;font-weight:500}
.fact .s{font-size:14px;color:var(--muted)}

.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
.card .role{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:15px}
.card dt{color:var(--muted)}
.card dd{margin:0;overflow-wrap:anywhere}
.card ul{margin:0;padding-left:18px;font-size:15px}
.tbc{color:var(--warn);font-style:italic}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:26px}
.day{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:grid;gap:4px;align-content:start;min-width:0}
.day b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
.day span{font-size:13px;line-height:1.35}
.day.main{background:var(--olive);border-color:var(--olive);color:var(--band-ink)}
.day.main b{color:var(--band-ink)}
@media (max-width:720px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}.day.main{grid-column:1/-1}}

.phase{margin-top:26px}
.phase-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.phase-title .when{font-family:var(--f-serif);font-size:26px;font-style:italic}
.phase-title .tag{font-size:13px;color:var(--muted)}

.tl{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 190px;gap:6px 18px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--olive)}
.row .what h3{margin-bottom:2px}
.row .what p{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
.row .who{font-size:14px;display:grid;gap:4px;align-content:start}
.row .who .place{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink);margin:0 4px 4px 0;white-space:nowrap}
.pill.qk{background:var(--olive-soft);color:var(--olive-deep)}
:root[data-theme="dark"] .pill.qk{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.qk{color:var(--ink)}}
.row.key{background:linear-gradient(90deg,var(--olive-soft),transparent 70%)}
.row.key .t{color:var(--plum)}
.flag{display:inline-block;font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 7px;margin-top:6px}
@media (max-width:640px){.row{grid-template-columns:70px minmax(0,1fr)}.row .who{grid-column:2}}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.list-clean{margin:0;padding-left:18px;display:grid;gap:6px}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.matrix th,.matrix td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.matrix th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.matrix tr:last-child td{border-bottom:0}

.q{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.q .card h3{font-family:var(--f-serif);font-size:22px;font-weight:500}

.actions-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--band-ink)}
.count{font-size:14px;color:var(--muted);margin-left:auto}
.alist{display:grid;gap:8px}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.aitem.done .atitle{text-decoration:line-through;color:var(--muted)}
.status{font:inherit;font-size:12px;border-radius:999px;padding:4px 10px;border:0;cursor:pointer;min-width:62px}
.status.open{background:var(--open-bg);color:var(--plum)}
.status.bezig{background:var(--warn-bg);color:var(--warn)}
.status.klaar{background:var(--ok-bg);color:var(--ok)}
.status:disabled{cursor:default}
.atitle{font-weight:500}
.ameta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.anote{font-size:14px;color:var(--muted);margin-top:2px}
.adel{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px}
.adel.confirm{color:var(--warn);font-weight:600}
.addform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px}
.addform input,.addform select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.addform button{font:inherit;background:var(--olive);color:var(--band-ink);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.addform .err{grid-column:1/-1;font-size:13px;color:var(--warn)}
@media (max-width:640px){.addform{grid-template-columns:1fr 1fr}.addform input#a-title{grid-column:1/-1}}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:15px}

footer{padding-block:48px 56px;color:var(--muted);font-size:14px}
footer .sig{font-family:var(--f-script);font-size:40px;color:var(--olive);line-height:1}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hero{margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.awho{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.sync{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="ok"] .dot{background:var(--ok)}
.sync[data-state="pending"] .dot{background:var(--warn)}
.sync[data-state="offline"] .dot,.sync[data-state="err"] .dot{background:var(--warn)}
.sync[data-state="err"]{color:var(--warn)}
.installhint{background:var(--olive-soft);border-bottom:1px solid var(--line);font-size:14px}
.installhint .wrap{display:flex;gap:12px;align-items:center;padding-block:10px}
.installhint p{margin:0;flex:1}
.installhint button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--ink);cursor:pointer}
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--olive-deep);color:var(--band-ink);padding:24px 16px;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.lock .box{width:100%;max-width:360px;display:grid;gap:16px;text-align:center}
.lock .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.lock h1{font-family:var(--f-script);font-weight:400;font-size:64px;line-height:1;margin:0}
.lock form{display:grid;gap:10px;text-align:left}
.lock label{font-size:13px;opacity:.85}
.lock input{font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--band-ink);width:100%}
.lock input::placeholder{color:rgba(251,250,245,.5)}
.lock button{font:inherit;font-size:16px;font-weight:500;padding:12px;border-radius:10px;border:0;background:var(--band-ink);color:var(--olive-deep);cursor:pointer;margin-top:6px}
.lock .err{color:#F6D58E;font-size:14px}
.lock .small{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <div class="box">
    <div class="eyebrow">QuaKoken</div>
    <h1>Draaiboek</h1>
    <form id="lockform" novalidate>
      <label for="code">Toegangscode</label>
      <input id="code" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code van Joris">
      <label for="naam">Je naam <span class="small">(zodat anderen zien wie wat aanpaste)</span></label>
      <input id="naam" type="text" autocomplete="given-name" placeholder="Je voornaam">
      <div class="err" id="lockerr" hidden></div>
      <button type="submit">Openen</button>
    </form>
    <div class="small">Je hoeft de code maar één keer in te vullen.</div>
  </div>
</div>
<div id="app" hidden></div>
<script type="module" src="app.bundle.js?v=mw3wm4ti"></script>
</body>
</html>
